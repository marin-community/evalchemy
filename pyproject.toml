[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalchemy"
version = "0.1.0"
description = "Evalchemy Evaluation Framework"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Lean core: everything `python -m eval.eval` needs to evaluate a *served*
    # OpenAI-compatible endpoint (--model local-completions / curator) and grade the
    # requested benchmarks. Per-benchmark and GPU/accelerator deps live in the extras
    # below; nothing here pulls torch (its imports on the core path are guarded, so the
    # endpoint flow runs torch-free -- see eval/eval.py, eval/task.py, eval/eval_tracker.py).

    # LM Eval -- pinned to the latest stable upstream EleutherAI release (v0.4.12).
    # Previously a fork (EtashGuha/lm-evaluation-harness@etashg/tokenize_fix); verified
    # the fork carried no grader/metric patch missing upstream (boxed-answer math grader
    # lm_eval/tasks/hendrycks_math/utils.py is byte-identical; the fork's sole code delta
    # -- a one-line EOS-token truncation in models/huggingface.py -- is superseded upstream
    # by postprocess_generated_text + stop-sequence handling). The removed lm_eval CLI/logging
    # symbols are reprovided via eval/lm_eval_compat.py.
    #
    # [api]  -- the OpenAI-compatible / local-completions client (requests, aiohttp,
    #           tenacity, tiktoken). [math] -- the boxed-answer math grader that AIME/AMC/
    #           MATH500 grade against (sympy, antlr4-python3-runtime, math_verify).
    # NB: the local-vLLM engine is an OPTIONAL extra (`.[vllm]`), not a base dep. It is a
    # large, GPU/accelerator-oriented package and is unnecessary when evaluating against a
    # *served* endpoint (the marin-serve / e2e path) -- the server owns inference. Keeping
    # it out of the base install lets evalchemy install on a CPU box for endpoint-dispatch eval.
    "lm-eval[api,math] @ git+https://github.com/EleutherAI/lm-evaluation-harness@v0.4.12",

    # curator registers the `curator` model at eval.eval import; also brings
    # litellm / instructor / nest-asyncio / openai / pandas transitively.
    "bespokelabs-curator>=0.1.16.0",

    # Runtime tokenizer / chat-template for API models. lm-eval 0.4.x imports symbols
    # transformers 5 removed, so cap below it.
    "transformers>=4.31,<5",
    # Slow-tokenizer backends for common models.
    "sentencepiece",
    "protobuf",

    # Imported at module load on the core eval path (curator_lm / precomputed_hf_lm /
    # upload_to_hf_lm register their models at import; database/utils is imported by
    # eval_tracker; task.py imports numpy).
    "datasets",
    "huggingface_hub",
    "openai",
    "numpy",
    "pyyaml",
    # HMMT grades via the vendored `matharena`, which imports loguru at module load;
    # kept in core so the math benchmarks (AIME/AMC/MATH500/HMMT) all import lean.
    "loguru",
    # Vendored code graders (HumanEval/HumanEvalPlus/MBPPPlus evaluation.py) and the
    # matharena grader (HMMT) `import regex` at module load. regex is already pulled
    # transitively by tiktoken / transformers / nltk, but HMMT is a lean (empty-extra)
    # benchmark, so its grader deps must live in core -- declaring it here keeps the
    # import tracked rather than relying on a transitive edge that a resolver could drop.
    "regex",

    # eval.eval_tracker imports database/ at module load (config.py runs load_dotenv();
    # utils.py builds a SQLAlchemy engine). The postgres DRIVER is only needed for
    # --use_database, so it lives in the `database` extra.
    "sqlalchemy",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/mlfoundations/evalchemy"
Repository = "https://github.com/mlfoundations/evalchemy.git"

# Console entry points for the eval CLI (two aliases, as upstream lm-eval ships).
# `uvx --from git+https://github.com/marin-community/evalchemy eval ...` runs this.
[project.scripts]
eval = "eval.eval:cli_evaluate"
evalchemy = "eval.eval:cli_evaluate"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "pre-commit",
]

# The serve-and-eval runner (eval/serve_eval/): the run/validate CLIs use click,
# parse results/spec JSON with pydantic, and load the run config (qwen-tiny.yaml) with
# pydantic-settings. marin-rigging exports bounded, best-effort lifecycle records to
# Finelog without pulling marin-core. This is an optional extra, not a base dependency:
# base evalchemy evaluates fine without the runner. The regression gate
# (eval/regression/) reuses these same deps.
#
# s3fs gives fsspec an s3:// backend so an endpoint-eval job can route its result
# artifacts (results JSON + per-sample --output_path tree) to durable S3/R2 object
# storage instead of a pod-local path that is garbage-collected when the pod ends.
# The eval pod inherits AWS creds + FSSPEC_S3 (endpoint + virtual-host addressing) from
# its runtime env, so bare `fsspec.core.url_to_fs("s3://...")` authenticates with no extra
# config -- it just needs the s3 filesystem installed, which the lean base omits.
serve-eval = [
    "click>=8",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "s3fs",
    "marin-rigging>=0.2.67.dev30673006835",
]

# Postgres driver for the --use_database result-tracking path only. DATABASE_URL
# (database/config.py) uses the plain `postgresql://` dialect, for which SQLAlchemy
# loads the psycopg2 DBAPI. Base evalchemy writes results to JSON and never opens the DB,
# so this stays out of the core install.
database = [
    "psycopg2-binary",
]

# --- Per-benchmark extras (one per eval/chat_benchmarks dir) --------------------
#
# Contract: extra `<x>` installs exactly the module-level deps that benchmark dir X
# needs BEYOND the lean base. eval/task.py execs a benchmark's eval_instruct.py by file
# path, and only when the dir name is in --tasks, so `evalchemy[mtbench]` pulls just
# MTBench's deps -- you compose the support you want (`evalchemy[mbpp,ifeval,repobench]`),
# the way lm-eval composes per-task extras under its `tasks` union.
#
# The extra name is the PEP-685-normalized dir name (lowercase, `_`/`.`->`-`): MTBench ->
# `mtbench`, alpaca_eval -> `alpaca-eval`, LiveCodeBenchv5_official -> `livecodebenchv5-official`.
# Benchmarks the lean base already covers get an EMPTY extra (see the block further down),
# so `evalchemy[<any benchmark dir>]` is uniformly valid. `benchmarks` is the union of them
# all. Each non-empty extra is verified in ISOLATION (base + that one extra, nothing else)
# by scripts/ci/check_benchmark_extras.py -- a dep that goes missing or pulls torch fails
# there, in CI, not at eval time. Local inference installs torch through the `vllm` extra;
# benchmark extras cover endpoint generation and grading only.
# `fschat`/`alpaca-eval` resolve from the vendored copies via [tool.uv.sources] for a
# workspace `uv sync`; a git/uvx install falls back to the PyPI packages.
bigcodebench = ["fire", "regex", "tree_sitter", "tree-sitter-python", "pqdm"]
cruxeval = []
humaneval = ["fire"]
humanevalplus = ["fire"]
ifeval = ["nltk", "langdetect", "absl-py", "immutabledict"]
ifbench = ["nltk", "emoji", "syllapy"]
# LiveBench's FastChat adapter registry selects conversation templates without importing
# its torch-backed local model loaders. Its vendored IFEval judge needs
# langdetect/immutabledict/nltk, and the lcb_runner code-exec grader imports pyext at
# module load; the penfever py3 fork is the only pyext that imports under Python 3.
livebench = [
    "psutil",
    "fschat",
    "shortuuid",
    "nltk",
    "langdetect",
    "immutabledict",
    "prettytable",
    "lark",
    "pyext @ git+https://github.com/penfever/PyExt",
]
mbpp = ["fire"]
mbppplus = ["fire"]
# MTBench's torch-free llm_judge path imports anthropic and FastChat's conversation
# templates. FastChat's local model adapter remains available when `vllm` supplies torch.
mtbench = ["fschat", "anthropic", "psutil", "shortuuid"]
mixeval = ["nltk", "prettytable"]
multiple = ["fire", "regex", "tree_sitter"]
repobench = ["fuzzywuzzy", "codebleu"]
swebench = ["swebench>=3.0.4"]
wildbench = ["jsonlines", "cohere", "anthropic", "reka-api", "together"]
alpaca-eval = ["alpaca-eval", "patsy"]
zeroeval = ["google-generativeai", "cohere", "anthropic", "reka-api", "together"]

# Empty extras: these benchmark dirs import nothing beyond the lean base (their graders
# ride on lm-eval[math]/[api], datasets, numpy, transformers, loguru -- all in base), so
# `uv sync --extra <x>` here resolves to the base install. They exist so every benchmark
# dir has a valid extra name and the `benchmarks` union can list them uniformly; the
# lean-install check (scripts/ci/check_lean_install.py) already guards that these import
# torch-free, so check_benchmark_extras.py skips them unless run with --all.
aime24 = []
aime25 = []
aiw = []
amc23 = []
codeelo = []
codeforces = []
financebench = []
gpqadiamond = []
# GSM8KPerturbed's run-time deps are covered by the lean base; dataset
# regeneration additionally needs `datasets` and `cmudict` (see data_prep/generate.py).
gsm8kperturbed = []
hle = []
hmmt = []
jeebench = []
livecodebench = []
livecodebenchv5 = []
livecodebenchv5-official = []
math500 = []
mmlupro = []
nupa = ["ijson"]
# OlympiadBench grades via lm-eval's hendrycks_math boxed-answer utils (in the lean base
# via lm-eval[math]). The legacy subset is local; the pinned full text-only task loads
# through datasets, also in the lean base, so neither needs an extra dependency.
olympiadbench = []
olympiadbenchfull = []

# Every benchmark under eval/chat_benchmarks, as a single install. Self-referential union
# (uv expands `evalchemy[...]` against this project's own extras), the same shape lm-eval
# ships its `tasks` union in. `uv sync --extra benchmarks` gives you the whole tree.
benchmarks = [
    "evalchemy[aime24,aime25,aiw,amc23,bigcodebench,codeelo,codeforces,cruxeval,financebench,gpqadiamond,gsm8kperturbed,hle,hmmt,humaneval,humanevalplus,ifbench,ifeval,jeebench,livebench,livecodebench,livecodebenchv5,livecodebenchv5-official,math500,mbpp,mbppplus,mmlupro,mtbench,mixeval,multiple,nupa,olympiadbench,olympiadbenchfull,repobench,swebench,wildbench,alpaca-eval,zeroeval]",
]

# --- Marin `marin-serve` (Iris) provider for the runner (eval/serve_eval/) -------
#
# marin-serve is NOT an evalchemy optional-dependency, on purpose. The runner
# dispatches over an OpenAI-compatible HTTP endpoint (eval/serve_eval/providers.py),
# so the serving tool (marin-core) and the eval stack (evalchemy) are SEPARATE
# environments that never share a Python import graph. Co-installing them is not
# just unnecessary, it is unsatisfiable: marin-core (nightly) requires Python
# >=3.12 and pins newer fsspec / curator ranges than evalchemy's eval deps, so
# `evalchemy[marin-core]` cannot resolve.
#
# Install marin-serve as an ISOLATED tool instead (its console scripts land on
# PATH, which is all the `marin-serve` provider needs). The `marin-*` libs publish
# to public PyPI as nightly pre-releases (`<base>.dev<stamp>`):
#
#     uv tool install --prerelease allow "marin-core>=0.2.0.dev0"
#     # or, to pin the newest nightly explicitly:
#     uv tool install "marin-core==<base>.dev<stamp>"
#
# NOTE: a `>=X.Y.Z.dev0` floor alone does NOT force a nightly -- a stable X.Y.Z
# sorts above every X.Y.Z.dev*. The nightly workflow (.github/workflows/e2e-nightly.yaml)
# does exactly this isolated install; the `endpoint` provider needs none of it.

# Local vLLM inference engine. Needed only to serve/evaluate models locally
# (`--model vllm`); NOT needed to evaluate against a served OpenAI-compatible
# endpoint. accelerate keeps the vendored FastChat model adapters available once
# torch is installed. Split these out of the base deps so a CPU-only install stays lean.
vllm = [
    "accelerate",
    "lm-eval[vllm] @ git+https://github.com/EleutherAI/lm-evaluation-harness@v0.4.12",
]

[tool.uv.sources]
# Resolve the vendored FastChat / alpaca_eval copies from local paths -- they serve the
# `mtbench` (fschat) and `alpaca-eval` extras. Using an absolute-at-resolve-time path
# source avoids baking a relative `file:` URL into the built wheel metadata (which uv
# cannot re-parse: "relative path without a working directory"). These apply to a
# workspace `uv sync`; a git/uvx install of those extras falls back to the PyPI packages.
fschat = { path = "eval/chat_benchmarks/MTBench" }
alpaca-eval = { path = "eval/chat_benchmarks/alpaca_eval" }

[tool.hatch.build.targets.wheel]
# Ship the eval driver and the benchmark tree (chat_benchmarks dirs have no __init__.py
# and carry data files: eval/task.py execs each eval_instruct.py by path and loads its
# data at runtime) plus the DB models. force-include copies the trees verbatim so the
# data files and the __init__-less benchmark dirs land in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"eval" = "eval"
"database" = "database"
"packages/evalchemy-config/src/evalchemy_config" = "evalchemy_config"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Marin coding standards (https://github.com/marin-community/marin-style), run via
# `infra/pre-commit.py`. Evalchemy is a fork of mlfoundations/evalchemy, so this is
# deliberately scoped:
#
#   include -- an allowlist of the Marin-owned directories. Upstream code (the rest of
#              eval/, database/, configs/, scripts/) is left alone, so the standards
#              never reformat it into a merge-conflict minefield. Widen this only when a
#              directory becomes Marin-owned.
#   checks  -- `ruff-check` only (lint), no formatter. Formatting stays with upstream's
#              black hook (.pre-commit-config.yaml, [tool.black] below), which runs on
#              commit. A kit formatter here would fight that hook over the same files:
#              each would undo the other's work. ruff-check has no formatting opinions,
#              so the two coexist.
#   black_version -- inert while no formatter is enabled above, and set purely as a
#              guard: it pins the black the commit hook already uses (23.1.0) rather
#              than the kit's newer default (25.9.0), so that turning the `black` check
#              on later cannot silently introduce a version skew against the hook.
#              `ruff_version` is left at the kit default -- this repo pins no ruff
#              release, so there is nothing to match it to.
#
# See AGENTS.md ("Fork policy") for what "Marin-owned" means here.
[tool.marin-style]
checks = ["ruff-check"]
black_version = "23.1.0"
include = [
    "eval/serve_eval/**",
    "eval/regression/**",
    "eval/lm_eval_tasks/**",
    "eval/graders/**",
    "tests/e2e/**",
    "tests/drop/**",
    "tests/graders/**",
    "scripts/benchmarks/**",
    "packages/evalchemy-config/**",
    "scripts/ci/**",
    "infra/**",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3
