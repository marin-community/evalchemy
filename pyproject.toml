[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalchemy"
version = "0.1.0"
description = "Evalchemy Evaluation Framework"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core ML and Deep Learning
    "torch",
    "torchvision",
    "transformers",
    "accelerate",
    "peft",
    "trl",
    "bitsandbytes",
    "sentencepiece",
    "sentence-transformers>=2.2.2",
    "optimum==1.12.0",
    
    # Machine Learning and Scientific Computing
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "faiss-cpu==1.7.4",
    
    # ML Experiment Tracking & Visualization
    "wandb",
    "tensorboard",
    "evaluate",
    
    # NLP & Text Processing
    "nltk",
    "fasttext-wheel",
    "codebleu",
    "sacrebleu",
    "langdetect",
    "fuzzywuzzy",
    "python-Levenshtein",
    
    # Data Processing & Parsing
    "datasets",
    "protobuf",
    "bs4",
    "lxml",
    "fastavro",
    "jsonpickle",
    "hjson",
    "msgpack",
    
    # AI Service Providers
    "openai",
    "anthropic",
    "cohere",
    "google-generativeai",
    "mistralai",
    "reka-api",
    "together",
    "dashscope",
    "fschat",  # local vendored copy; path resolved via [tool.uv.sources] below
    
    # Cloud & Storage
    "gcsfs",
    "google-cloud-aiplatform",
    "google-auth==2.25.1",
    "boto3",
    "botocore",
    "sagemaker",
    # Relaxed from ==2024.6.1: an exact pin conflicts with anything needing a
    # newer fsspec (e.g. marin-core, the [iris] extra, wants >=2025.3.0). `datasets`
    # already floors fsspec; keep a floor here, not a hard pin, so the two coexist.
    "fsspec>=2024.6.1",
    "hf-transfer",
    "huggingface_hub[cli]",
    
    # Code Analysis & Development
    "black",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree_sitter",
    "asttokens",
    "mypy_extensions",
    "pyext @ git+https://github.com/penfever/PyExt",
    
    # Web & API
    "fastapi>=0.101.0",
    "uvicorn>=0.23.0",
    "aiohttp[speedups]>=3.8",
    "httpx",
    "httpx-sse",
    "requests>=2.28",
    "websocket",
    "aiofiles",
    "bespokelabs-curator>=0.1.16.0",
    
    # Database
    "sqlalchemy",
    "psycopg[binary]",
    "psycopg2-binary",
    "sqlitedict",
    
    # Utilities
    "tqdm",
    "pqdm",
    "python-box",
    "fire",
    "tiktoken",
    "ray[default]",
    "backoff>=2.2",
    "docker-pycreds",
    "sentry-sdk",
    "loguru>=0.7",
    "python-dotenv",
    "shortuuid",
    "tenacity",
    "prettytable",
    "portalocker",
    "tabulate",
    "colorama",
    "termcolor",
    "distro",
    "typing_inspect",
    "py-cpuinfo",
    "jiter",
    "patsy",
    "joblib",
    "threadpoolctl",
    "jmespath",
    "immutabledict",

    # BigCodeBench
    "appdirs>=1.4.4",
    "multipledispatch>=0.6.0",
    "pqdm>=0.2.0",
    "tempdir>=0.7.1",
    "tree_sitter_languages>=1.10.2",
    "wget>=3.2",

    # SWE-bench
    "swebench>=3.0.4",

    # LM Eval -- pinned to the latest stable upstream EleutherAI release (v0.4.12).
    # Previously a fork (EtashGuha/lm-evaluation-harness@etashg/tokenize_fix); verified
    # the fork carried no grader/metric patch missing upstream (boxed-answer math grader
    # lm_eval/tasks/hendrycks_math/utils.py is byte-identical; the fork's sole code delta
    # -- a one-line EOS-token truncation in models/huggingface.py -- is superseded upstream
    # by postprocess_generated_text + stop-sequence handling). The removed lm_eval CLI/logging
    # symbols are reprovided via eval/lm_eval_compat.py.
    #
    # NB: the local-vLLM engine is an OPTIONAL extra (`.[vllm]`), not a base dep.
    # It is a large, GPU/accelerator-oriented package and is unnecessary when
    # evaluating against a *served* OpenAI-compatible endpoint (the marin-serve /
    # e2e path) -- the server owns inference. Keeping it out of the base install
    # lets evalchemy install on a CPU box for endpoint-dispatch eval.
    "lm-eval @ git+https://github.com/EleutherAI/lm-evaluation-harness@v0.4.12",
]

[project.urls]
Homepage = "https://github.com/mlfoundations/evalchemy"
Repository = "https://github.com/mlfoundations/evalchemy.git"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "pre-commit",
]

# The serve-and-eval runner (eval/serve_eval/): the run/validate CLIs use click,
# parse results/spec JSON with pydantic, and load the run config (qwen-tiny.yaml) with
# pydantic-settings. An optional extra, not base deps -- base evalchemy evaluates fine
# without the runner, and this keeps a plain `uv sync` lean. The regression gate
# (eval/regression/) reuses these same deps.
serve-eval = [
    "click>=8",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
]

# --- Marin `marin-serve` (Iris) provider for the runner (eval/serve_eval/) -------
#
# marin-serve is NOT an evalchemy optional-dependency, on purpose. The runner
# dispatches over an OpenAI-compatible HTTP endpoint (eval/serve_eval/providers.py),
# so the serving tool (marin-core) and the eval stack (evalchemy) are SEPARATE
# environments that never share a Python import graph. Co-installing them is not
# just unnecessary, it is unsatisfiable: marin-core (nightly) requires Python
# >=3.12 and pins newer fsspec / curator ranges than evalchemy's eval deps, so
# `evalchemy[marin-core]` cannot resolve.
#
# Install marin-serve as an ISOLATED tool instead (its console scripts land on
# PATH, which is all the `marin-serve` provider needs). The `marin-*` libs publish
# to public PyPI as nightly pre-releases (`<base>.dev<stamp>`):
#
#     uv tool install --prerelease allow "marin-core>=0.2.0.dev0"
#     # or, to pin the newest nightly explicitly:
#     uv tool install "marin-core==<base>.dev<stamp>"
#
# NOTE: a `>=X.Y.Z.dev0` floor alone does NOT force a nightly -- a stable X.Y.Z
# sorts above every X.Y.Z.dev*. The nightly workflow (.github/workflows/e2e-nightly.yaml)
# does exactly this isolated install; the `endpoint` provider needs none of it.

# Local vLLM inference engine. Needed only to serve/evaluate models locally
# (`--model vllm`); NOT needed to evaluate against a served OpenAI-compatible
# endpoint. Split out of the base deps so a CPU-only install stays lean.
vllm = [
    "lm-eval[vllm] @ git+https://github.com/EleutherAI/lm-evaluation-harness@v0.4.12",
]

[tool.uv.sources]
# Resolve the vendored FastChat copy from a local path. Using an absolute-at-
# resolve-time path source avoids baking a relative `file:` URL into the built
# wheel metadata (which uv cannot re-parse: "relative path without a working
# directory").
fschat = { path = "eval/chat_benchmarks/MTBench" }

[tool.hatch.build.targets.wheel]
packages = ["evalchemy", "database"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.setuptools]
packages = ["evalchemy"]

[tool.setuptools.package-dir]
evalchemy = "evalchemy"
