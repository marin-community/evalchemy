# DROP task override (marin-community/evalchemy#31).
#
# Identical to the upstream lm-eval `drop` task (EleutherAI/lm-evaluation-harness
# v0.4.12) EXCEPT for the added `filter_list`, which extracts the short answer span from
# a verbose completion before the strict DROP token-F1 scoring. Without it, a model run
# without a chat template (local-completions) produces verbose completions whose token-F1
# collapses to ~0 even when the correct answer is present (grid-wide f1 ~= 0.002).
#
# This file overrides the upstream `drop` task because evalchemy loads it via
# `include_path` (see eval/eval.py -> DEFAULT_LM_EVAL_INCLUDE_DIR), and include_path task
# configs take precedence over the packaged defaults. Generation is unchanged; the fix is
# purely scoring-side.
task: drop
dataset_path: EleutherAI/drop
output_type: generate_until
training_split: train
validation_split: validation
process_docs: !function utils.process_docs
doc_to_text: "{{passage}} {{question}}"
doc_to_target: "{{ answer|join(',')}}"
target_delimiter: ""
process_results: !function utils.process_results
should_decontaminate: true
doc_to_decontamination_query: "{{passage}} {{question}}"
generation_kwargs:
  until:
    - "."
filter_list:
  - name: extract_answer
    filter:
      # Pull the short answer out of the (possibly verbose, no-template) completion...
      - function: custom
        filter_fn: !function utils.drop_answer_extraction_filter
      # ...then keep the first sample, matching upstream drop's take_first semantics.
      - function: take_first
metric_list:
  - metric: em
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 3.1
