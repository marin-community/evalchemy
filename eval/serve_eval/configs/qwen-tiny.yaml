# Run config for the serve-and-eval runner: Qwen3-0.6B on gsm8k.
# Loaded by eval.serve_eval.config.RunConfig (pydantic-settings). CLI flags and E2E_*
# env vars override these. See eval/serve_eval/README.md. The gate spec a run is
# checked against lives with the regression gate -- see eval/regression/.

model: Qwen/Qwen3-0.6B
model_revision: null          # pin a commit before recording a numeric spec -- the Hub tag is mutable
tokenizer: Qwen/Qwen3-0.6B

# gsm8k is self-graded (exact-match) -- no judge model, no OPENAI_API_KEY -- so it
# is a clean generation smoke through the chat endpoint.
tasks:
  - gsm8k
apply_chat_template: true
limit: 200                    # human default; CI passes --limit 20; --limit 0 runs the full task
num_fewshot: 5
batch_size: 1
seed: 1234                    # pinned greedy decoding
# Qwen3 emits <think> ... </think> before the answer; 256 (lm-eval default) truncates it.
gen_kwargs: temperature=0,do_sample=false,max_gen_toks=1024
extra_model_args:
  # num_concurrent=1 sends one request at a time, so vLLM's batch composition is
  # constant run-to-run. Greedy output then reproduces on the same slice type. It is
  # slower; bump it for ad-hoc human runs that don't gate.
  num_concurrent: 1
  timeout: 120
  max_retries: 3

# marin-serve provider
cluster: marin
# The RunConfig default uses v6e-4 in any available region; override with --tpu.
region: null
wait_timeout_s: 1800
timeout_hours: 2
